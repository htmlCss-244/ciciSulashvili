<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>კონტაქტი - Tbilisi Guide</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./styles/mystyle.css">
</head>
<body class="contactBody">
    <header>
        <nav class="navbar">
            <div class="logo">TBILISI <span>GUIDE</span></div>
            <div class="nav-links">
                <a href="index.html">მთავარი</a>
                <a href="aboutus.html">ჩვენს შესახებ</a>
                <a href="services.html">სერვისები</a>
                <a href="blog.html">ბლოგი</a>
                <a href="contact.html">კონტაქტი</a>
            </div>
        </nav>
    </header>
    <main class="contact-main">
        <section class="ourcontactinfo">
            <h1>დაგვიკავშირდით</h1>
            <p>-გაქვთ კითხვები? -მოგვწერეთ და ჩვენი გუნდი მალე გიპასუხებთ.</p>
        </section>
        <div class="form-Container">
            <form id="contactForm" class="styledForm">
                <div class="personalInfo">
                    <label for="name">სახელი და გვარი:</label>
                    <input type="text" id="name" name="name" placeholder="ჩაწერეთ სახელი...">
                </div>
                <div class="personalInfo">
                    <label for="email">ელ. ფოსტა:</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.com">
                </div>

                <div class="personalInfo">
                    <p>თემატიკა:</p>
                    <div class="options">
                        <input type="radio" id="tour" name="subject" value="tour" checked>
                        <label for="tour">ტურები</label>
                        
                        <input type="radio" id="hotel" name="subject" value="hotel">
                        <label for="hotel">სასტუმრო</label>
                        
                        <input type="radio" id="other" name="subject" value="other">
                        <label for="other">სხვა</label>
                    </div>
                </div>

                <div class="personalInfo">
                    <label for="message">შეტყობინება:</label>
                    <textarea id="message" rows="5" placeholder="თქვენი შეტყობინება..."></textarea>
                </div>

                <div class="input-group checkbox-group">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe" id="News">გამოიწერეთ სიახლეები</label>
                </div>

                <button type="submit" class="submitBtn">გაგზავნა</button>
                <p id="form-feedback" class="feedback-msg"></p>
            </form>
        </div>
    </main>
    <footer class="footerSection">
        <div class="copyRight">
            <p>© 2026 Tbilisi Guide. ყველა უფლება დაცულია.</p>
        </div>
    </footer>
    <script src="./js/myjavascr.js"></script>
</body>
</html>
